name: Callan evals

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      RUN_MODE: mock
      LIVE_CALLS: "false"
      LIVE_EMAILS: "false"
      LIVE_PAYMENTS: "false"
      LIVE_BROWSER_SESSIONS: "false"
      LIVE_PUBLIC_OUTREACH: "false"
      LIVE_BUILDS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Deployment readiness
        run: npm run check:deploy

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callan-browser-readiness
          path: output/playwright
          if-no-files-found: ignore
