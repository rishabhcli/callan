services:
  callmemaybe:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/.data
    ports:
      - "8787:8787"
    volumes:
      - callan_data:/app/.data
    tmpfs:
      - /tmp:size=128m,mode=1777
    stop_grace_period: 15s

volumes:
  callan_data:
